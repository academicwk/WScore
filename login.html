<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>เข้าสู่ระบบ - W-Score</title>

<!-- Google Font: Sarabun -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.config.js"></script>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans min-h-screen flex items-center justify-center bg-wsecondary p-4">

  <!-- พื้นหลังตกแต่ง -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-24 -left-24 w-72 h-72 bg-wprimary/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 w-72 h-72 bg-waccent/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- แถบหัวการ์ด -->
      <div class="bg-white px-6 pt-8 pb-6 text-center relative">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-wprimary via-waccent to-wprimary"></div>
        <img src="assets/img/logo.png" alt="W-Score Logo" class="h-32 mx-auto mb-3 object-contain">
        <h1 class="text-white text-lg font-semibold leading-snug">
          โรงเรียนเทศบาลวัดโขดทิมทาราม
        </h1>
        <p class="text-wprimary text-sm font-medium mt-1">
          ระบบบริหารจัดการวัดและประเมินผลการเรียนรู้
        </p>
      </div>

      <!-- ฟอร์ม Login -->
      <form id="loginForm" class="px-6 sm:px-8 py-8 space-y-5" autocomplete="off">

        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">
            ชื่อผู้ใช้งาน
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="กรอกชื่อผู้ใช้งาน"
              class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:border-wprimary focus:ring-2 focus:ring-wprimary/30 outline-none transition"
              autocomplete="off"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
            รหัสผ่าน
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="กรอกรหัสผ่าน"
              class="w-full pl-10 pr-11 py-2.5 rounded-lg border border-gray-300 focus:border-wprimary focus:ring-2 focus:ring-wprimary/30 outline-none transition"
              autocomplete="off"
            >
            <button
              type="button"
              id="togglePassword"
              class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-400 hover:text-wsecondary transition"
              tabindex="-1"
            >
              <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="loginBtn"
          class="w-full bg-wprimary hover:bg-wprimary-dark text-white font-semibold py-2.5 rounded-lg shadow-md shadow-wprimary/30 transition flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>เข้าสู่ระบบ</span>
        </button>

      </form>

      <div class="px-6 sm:px-8 pb-6 text-center">
        <p class="text-xs text-gray-400">
          &copy; <span id="yearNow"></span> โรงเรียนเทศบาลวัดโขดทิมทาราม | ระบบ W-Score
        </p>
      </div>

    </div>
  </div>

<script src="assets/js/login.js"></script>
</body>
</html>
