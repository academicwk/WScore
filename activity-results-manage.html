<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>บันทึกผลกิจกรรมพัฒนาผู้เรียน - W-Score</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-gray-50">

  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="pt-16 lg:pl-64 min-h-screen transition-all">
    <div class="p-4 sm:p-6">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h1 class="text-lg font-bold text-wsecondary">
          <i class="fa-solid fa-medal text-wprimary mr-2"></i>บันทึกผลกิจกรรมพัฒนาผู้เรียน
        </h1>
      </div>

      <div class="bg-white rounded-xl shadow p-5 mb-4">
        <div class="flex flex-wrap items-end gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">ปีการศึกษา</label>
            <select id="yearFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">ระดับชั้น</label>
            <select id="gradeLevelFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
              <option value="">- เลือกระดับชั้น -</option>
            </select>
          </div>
          <div class="flex-1"></div>
          <button id="saveAllBtn"
                  class="px-5 py-2.5 text-sm font-medium text-white bg-wprimary hover:bg-wprimary-dark rounded-lg whitespace-nowrap hidden">
            <i class="fa-solid fa-floppy-disk mr-1.5"></i>บันทึกผลทั้งหมด
          </button>
        </div>
        <p class="text-xs text-gray-400 mt-3">
          ค่าเริ่มต้นของทุกคนคือ "ผ่าน" กรุณาติ๊กออกเฉพาะนักเรียนที่ไม่ผ่านกิจกรรมนั้นๆ — บันทึกได้พร้อมกันทุกห้องและทุกกิจกรรมของระดับชั้นที่เลือกในครั้งเดียว
        </p>
      </div>

      <div id="matrixContainer">
        <div class="bg-white rounded-xl shadow p-6 text-center text-gray-400 text-sm">
          กรุณาเลือกปีการศึกษาและระดับชั้น
        </div>
      </div>

    </div>
  </main>

<script src="assets/js/api.config.js"></script>
<script src="assets/js/menu.config.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/activity-results-manage.js"></script>
</body>
</html>
