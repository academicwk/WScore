<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ออกรายงาน ปถ.12 - W-Score</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-gray-50">

  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="pt-16 lg:pl-64 min-h-screen transition-all">
    <div class="p-4 sm:p-6">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h1 class="text-lg font-bold text-wsecondary">
          <i class="fa-solid fa-file-pdf text-wprimary mr-2"></i>ออกรายงาน ปถ.12
        </h1>
        <div class="flex flex-wrap items-center gap-2">
          <select id="yearFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          <select id="classFilter" class="hidden text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          <select id="semesterFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <option value="1">ภาคเรียนที่ 1</option>
            <option value="2">ภาคเรียนที่ 2</option>
          </select>
        </div>
      </div>

      <div id="pt12Content">
        <div class="bg-white rounded-xl shadow p-6 text-center text-gray-400 text-sm">
          กำลังโหลดข้อมูล...
        </div>
      </div>

    </div>
  </main>

  <!-- Modal : ความเห็นครูประจำชั้น 4 ด้านของนักเรียน 1 คน -->
  <div id="commentModal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-xl max-h-[90vh] flex flex-col">
      <div class="flex items-start justify-between gap-3 p-4 border-b border-gray-100">
        <div>
          <h3 class="text-base font-bold text-wsecondary">ความเห็นครูประจำชั้น</h3>
          <p id="commentModalTitle" class="text-sm text-gray-500 mt-0.5"></p>
        </div>
        <button id="commentModalClose" type="button" class="text-gray-400 hover:text-gray-600 text-lg" aria-label="ปิด">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="commentModalBody" class="p-4 space-y-4 overflow-y-auto"></div>
      <div class="flex justify-end gap-2 p-4 border-t border-gray-100">
        <button id="commentModalCancel" type="button" class="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">ยกเลิก</button>
        <button id="commentModalOk" type="button" class="px-5 py-2 text-sm font-medium text-white bg-wprimary hover:bg-wprimary-dark rounded-lg">
          <i class="fa-solid fa-floppy-disk mr-1.5"></i>บันทึก
        </button>
      </div>
    </div>
  </div>

<script src="assets/js/api.config.js"></script>
<script src="assets/js/menu.config.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pt12-report.js"></script>
</body>
</html>
