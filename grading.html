<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>กำหนดช่องเก็บคะแนน - W-Score</title>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-gray-50">

  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="pt-16 lg:pl-64 min-h-screen transition-all">
    <div class="p-4 sm:p-6">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h1 class="text-lg font-bold text-wsecondary">
          <i class="fa-solid fa-sliders text-wprimary mr-2"></i>กำหนดช่องเก็บคะแนน
        </h1>
        <div class="flex flex-wrap items-center gap-2">
          <select id="yearFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          <select id="subjectFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <option value="">- เลือกวิชา -</option>
          </select>
          <select id="semesterFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <option value="">- เลือกภาคเรียน -</option>
            <option value="1">ภาคเรียนที่ 1</option>
            <option value="2">ภาคเรียนที่ 2</option>
          </select>
        </div>
      </div>

      <div id="setupContent" class="space-y-4 mb-6">
        <div class="bg-white rounded-xl shadow p-6 text-center text-gray-400 text-sm">
          กรุณาเลือกปีการศึกษา วิชา และภาคเรียน เพื่อตั้งค่าคะแนน
        </div>
      </div>

    </div>
  </main>

  <!-- Modal เพิ่มช่องเก็บคะแนน -->
  <div id="subComponentModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="closeSubComponentModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <h2 class="font-semibold text-wsecondary">เพิ่มช่องเก็บคะแนน</h2>
          <button onclick="closeSubComponentModal()" class="text-gray-400 hover:text-gray-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="subComponentForm" class="p-5 space-y-4">
          <input type="hidden" id="f-componentId" value="">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อช่องเก็บคะแนน</label>
            <input id="f-subComponentName" type="text" required placeholder="เช่น ใบงาน, สอบย่อย 1"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30">
          </div>
          <p class="text-xs text-gray-400"><i class="fa-solid fa-circle-info mr-1"></i>ทุกช่องเก็บคะแนนเต็ม 10 คะแนนโดยอัตโนมัติ</p>
          

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeSubComponentModal()"
                    class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg">ยกเลิก</button>
            <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-wprimary hover:bg-wprimary-dark rounded-lg">บันทึก</button>
          </div>
        </form>
      </div>
    </div>
  </div>

<script src="assets/js/api.config.js"></script>
<script src="assets/js/menu.config.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/grading.js"></script>
</body>
</html>
