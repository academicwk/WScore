<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>จัดนักเรียนเข้าห้องเรียน - W-Score</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-gray-50">

  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="pt-16 lg:pl-64 min-h-screen transition-all">
    <div class="p-4 sm:p-6">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h1 class="text-lg font-bold text-wsecondary">
          <i class="fa-solid fa-people-group text-wprimary mr-2"></i>จัดนักเรียนเข้าห้องเรียน
        </h1>
        <div class="flex flex-wrap items-center gap-2">
          <select id="yearFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          <select id="classFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <option value="">- เลือกห้องเรียน -</option>
          </select>
          <button id="addEnrollmentBtn" class="flex items-center gap-2 bg-wprimary hover:bg-wprimary-dark text-white text-sm font-medium px-4 py-2 rounded-lg transition whitespace-nowrap">
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">เพิ่มนักเรียนเข้าห้อง</span>
          </button>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
              <tr>
                <th class="px-4 py-3 text-left w-20">เลขที่</th>
                <th class="px-4 py-3 text-left">รหัสนักเรียน</th>
                <th class="px-4 py-3 text-left">ชื่อ-นามสกุล</th>
                <th class="px-4 py-3 text-right">การจัดการ</th>
              </tr>
            </thead>
            <tbody id="enrollmentTableBody">
              <tr><td colspan="4" class="text-center text-gray-400 py-6">กรุณาเลือกห้องเรียน</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal เพิ่มนักเรียนเข้าห้อง -->
  <div id="enrollmentModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="closeEnrollmentModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <h2 id="modalTitle" class="font-semibold text-wsecondary">เพิ่มนักเรียนเข้าห้อง</h2>
          <button onclick="closeEnrollmentModal()" class="text-gray-400 hover:text-gray-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="enrollmentForm" class="p-5 space-y-4">
          <input type="hidden" id="f-isEdit" value="0">
          <input type="hidden" id="f-enrollmentId" value="">

          <div id="f-editWrap" class="hidden space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">นักเรียน</label>
              <select id="f-studentId" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-100" disabled></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">เลขที่ในห้อง</label>
              <input id="f-studentNumber" type="number" min="1"
                     class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            </div>
          </div>

          <div id="f-importWrap">
            <label class="block text-sm font-medium text-gray-700 mb-1">นำเข้ารายชื่อนักเรียนจากไฟล์ Excel</label>
            <button type="button" id="downloadTemplateBtn" class="text-xs text-wprimary hover:underline mb-2">
              <i class="fa-solid fa-download"></i> ดาวน์โหลดแบบฟอร์มเทมเพลต (.xlsx)
            </button>
            <input id="f-importFile" type="file" accept=".xlsx,.xls,.csv"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <p class="text-xs text-gray-400 mt-2">ไฟล์ต้องมีคอลัมน์หัวข้อ "รหัสประจำตัวนักเรียน" ระบุรหัสนักเรียน 1 คนต่อ 1 แถว ระบบจะจัดเรียงเลขที่ในห้องให้อัตโนมัติตามเลขประจำตัวนักเรียนจากน้อยไปมาก</p>

            <div id="importPreview" class="mt-3 hidden">
              <p class="text-sm font-medium text-gray-700 mb-1">รายชื่อที่พร้อมนำเข้า (<span id="importValidCount">0</span> คน)</p>
              <div id="importPreviewList" class="border border-gray-200 rounded-lg max-h-48 overflow-y-auto divide-y divide-gray-100 text-sm"></div>
              <p id="importInvalidNote" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeEnrollmentModal()"
                    class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg">ยกเลิก</button>
            <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-wprimary hover:bg-wprimary-dark rounded-lg">บันทึก</button>
          </div>
        </form>
      </div>
    </div>
  </div>

<script src="assets/js/api.config.js"></script>
<script src="assets/js/menu.config.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/enrollments-manage.js"></script>
</body>
</html>
