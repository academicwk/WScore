<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>บันทึกคะแนนรายวิชา - W-Score</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-gray-50">

  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="pt-16 lg:pl-64 min-h-screen transition-all">
    <div class="p-4 sm:p-6">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h1 class="text-lg font-bold text-wsecondary">
          <i class="fa-solid fa-pen-to-square text-wprimary mr-2"></i>บันทึกคะแนนรายวิชา
        </h1>
        <div class="flex flex-wrap items-center gap-2">
          <select id="yearFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          <select id="subjectFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <option value="">- เลือกวิชา -</option>
          </select>
          <select id="classFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <option value="">- เลือกห้องเรียน -</option>
          </select>
          <select id="semesterFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <option value="">- เลือกภาคเรียน -</option>
            <option value="1">ภาคเรียนที่ 1</option>
            <option value="2">ภาคเรียนที่ 2</option>
          </select>
        </div>
      </div>

      <div class="bg-amber-50 border border-amber-200 text-amber-700 text-xs rounded-lg px-4 py-2.5 mb-4">
        <i class="fa-solid fa-circle-info mr-1"></i>
        สามารถคัดลอกคะแนนจาก Excel แล้วคลิกที่ช่องแรกในตาราง จากนั้นวาง (Ctrl+V) เพื่อกรอกคะแนนหลายช่องพร้อมกันได้
      </div>

      <div id="entryContent">
        <div class="bg-white rounded-xl shadow p-6 text-center text-gray-400 text-sm">
          กรุณาเลือกปีการศึกษา วิชา ห้องเรียน และภาคเรียน เพื่อกรอกคะแนน
        </div>
      </div>

    </div>
  </main>

<script src="assets/js/api.config.js"></script>
<script src="assets/js/menu.config.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/grade-entry.js"></script>
</body>
</html>
