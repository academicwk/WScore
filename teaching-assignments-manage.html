<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>จัดการมอบหมายการสอน - W-Score</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/theme.config.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-gray-50">

  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="pt-16 lg:pl-64 min-h-screen transition-all">
    <div class="p-4 sm:p-6">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h1 class="text-lg font-bold text-wsecondary">
          <i class="fa-solid fa-chalkboard-user text-wprimary mr-2"></i>จัดการมอบหมายการสอน
        </h1>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1 sm:hidden">ปีการศึกษา</label>
          <select id="yearFilter" class="text-sm border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
        </div>
      </div>

      <!-- ฟอร์มมอบหมายการสอน -->
      <div class="bg-white rounded-xl shadow p-5 mb-4">
        <h2 class="text-sm font-bold text-wsecondary mb-4">
          <i class="fa-solid fa-plus text-wprimary mr-1.5"></i>มอบหมายการสอน
        </h2>

        <form id="assignForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">1. ครูประจำวิชา</label>
            <input id="teacherSearch" type="text" placeholder="พิมพ์เพื่อค้นหาชื่อครู..."
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-wprimary/30">
            <select id="f-teacherUserId" required size="1"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">2. วิชาที่สอน</label>
            <select id="f-subjectId" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">3. ห้องที่สอน (เลือกได้มากกว่า 1 ห้อง)</label>
            <div id="classCheckboxList"
                 class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 border border-gray-200 rounded-lg p-3 max-h-56 overflow-y-auto">
              <span class="text-xs text-gray-400 col-span-full">กรุณาเลือกครูและวิชาก่อน</span>
            </div>
          </div>

          <div class="flex justify-end">
            <button type="submit" id="saveAssignBtn"
                    class="px-5 py-2.5 text-sm font-medium text-white bg-wprimary hover:bg-wprimary-dark rounded-lg">
              <i class="fa-solid fa-floppy-disk mr-1.5"></i>บันทึกมอบหมาย
            </button>
          </div>
        </form>
      </div>

      <!-- ตารางรายการที่มอบหมายแล้ว -->
<div class="p-4 border-b border-gray-100">
  <h2 class="text-sm font-bold text-wsecondary">รายการมอบหมายการสอนปัจจุบัน</h2>
</div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
              <tr>
                <th class="px-4 py-3 text-left">ครูผู้สอน</th>
                <th class="px-4 py-3 text-left">รายวิชา</th>
                <th class="px-4 py-3 text-left">ห้องเรียน</th>
                <th class="px-4 py-3 text-right w-24">การจัดการ</th>
              </tr>
            </thead>
            <tbody id="assignmentTableBody">
              <tr><td colspan="4" class="text-center text-gray-400 py-6">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal แก้ไขมอบหมายการสอน -->
  <div id="editAssignModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="closeEditAssignModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-sm">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <h2 class="font-semibold text-wsecondary">แก้ไขมอบหมายการสอน</h2>
          <button onclick="closeEditAssignModal()" class="text-gray-400 hover:text-gray-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="editAssignForm" class="p-5 space-y-4">
          <input type="hidden" id="edit-teachingAssignmentId" value="">
          <input type="hidden" id="edit-academicYearId" value="">

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ครูประจำวิชา</label>
            <select id="edit-teacherUserId" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">วิชาที่สอน</label>
            <select id="edit-subjectId" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ห้องที่สอน</label>
            <select id="edit-classId" required
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wprimary/30"></select>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeEditAssignModal()"
                    class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg">ยกเลิก</button>
            <button type="submit" id="saveEditAssignBtn"
                    class="px-4 py-2 text-sm font-medium text-white bg-wprimary hover:bg-wprimary-dark rounded-lg">บันทึก</button>
          </div>
        </form>
      </div>
    </div>
  </div>

<script src="assets/js/api.config.js"></script>
<script src="assets/js/menu.config.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/teaching-assignments-manage.js"></script>
</body>
</html>
